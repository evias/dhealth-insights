<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Industry Insights — dHealth Intelligence</title>
  <meta name="theme-color" content="#16283A">
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <link href="/assets/base.min.css" rel="stylesheet">
  <script defer src="/assets/alpinejs.min.js"></script>
  <script src="/assets/logger.js"></script>
  <script defer src="/assets/marked.min.js"></script>
  <link href="/assets/fonts/IBMPlex.css" rel="stylesheet">
</head>
<body x-data="insightsUI()">
  <header class="flex flex-wrap items-center gap-x-4 gap-y-2 px-4 py-3 sm:px-8 sm:py-4">
    <!-- logo-dhealth-insights -->
    <svg class="logo" viewBox="0 0 64 64" aria-label="dHealth Insights">
      <rect width="64" height="64" rx="12" fill="#FFFFFF"/>
      <circle cx="32" cy="9" r="3.4" fill="#B07D1E"/>
      <path d="M32 14v6" stroke="#2C6BA0" stroke-width="2.6" stroke-linecap="round"/>
      <rect x="11" y="20" width="42" height="32" rx="9" fill="#16283A"/>
      <circle cx="23" cy="33" r="5" fill="#E8EDF2"/><circle cx="41" cy="33" r="5" fill="#E8EDF2"/>
      <circle cx="24.6" cy="31.4" r="1.6" fill="#16283A"/><circle cx="42.6" cy="31.4" r="1.6" fill="#16283A"/>
      <path d="M22 43.5q10 5.5 20 0" fill="none" stroke="#2C6BA0" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <div class="min-w-0">
      <h1 class="text-lg sm:text-xl">dHealth Intelligence</h1>
      <div class="sub">DAILY INDUSTRY INSIGHTS</div>
    </div>
    <div class="date flex flex-wrap items-center gap-x-1 w-full sm:w-auto sm:ml-auto">
      <span class="date" id="today"></span><span> • </span>
      <span class="date" x-text="'User: ' + insightsUserID"></span>
      <span
        @click="changeUserID()"
        class="date hover:cursor-pointer">
        <!-- arrow-path -->
        <svg
          xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
          stroke-width="1.5" stroke="currentColor"
          class="inline size-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
        </svg>
      </span>
    </div>
  </header>

  <main>
    <div class="toolbar flex-wrap">
      <span class="tagline w-full sm:w-auto">// community-ranked bulletins &mdash; cast your vote</span>
      <button class="btn" :class="{'active': sortedBy === 'hot'}" @click="sortBy('hot')">HOT</button>
      <button class="btn" :class="{'active': sortedBy === 'new'}" @click="sortBy('new')">NEW</button>
      <button class="btn" :class="{'active': sortedBy === 'top'}" @click="sortBy('top')">TOP</button>
      <button class="btn" @click="resetVotes()">RESET MY VOTES</button>
    </div>
    <div id="feed" class="min-h-screen">
      <template x-for="(bulletin, b_i) in sortedBulletins" :key="bulletin.id">
        <div>
          <article
            x-show="b_i > 0 && b_i % 2 === 0"
            class="cta-entry">
            <div class="left-panel">
              <div class="mx-auto">
                <a :href="'https://dhealth.com/contact'" target="_blank">
                  <img
                    src="/assets/logo-dhealth.png" title="dHealth Intelligence"
                    class="h-[96px] w-[96px] sm:h-[128px] sm:w-[128px]" />
                </a>
              </div>
            </div>
            <div
              class="w-full min-w-0 flex flex-col"
              x-data="{ cta: getRandomCTA() }">
              <h2 x-text="cta.title"></h2>
              <div class="flex flex-row items-center">
                <p x-text="cta.content"></p>
              </div>
              <div class="meta cta-meta flex flex-col sm:flex-row gap-2 sm:gap-1 items-stretch sm:items-end">
                <button
                  type="button"
                  target="_blank"
                  class="text-md relative inline-flex items-center justify-center gap-x-2 rounded-lg bg-teal-600 px-4 py-3 sm:px-6 sm:py-4 font-semibold text-white shadow-sm hover:cursor-pointer hover:bg-teal-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-600 w-full sm:w-auto"
                  @click="clickCTA(cta)">
                  <span x-text="cta.cta_text"></span>
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="-mr-0.5 h-5 w-5">
                    <path fill-rule="evenodd" d="M16.72 7.72a.75.75 0 011.06 0l3.75 3.75a.75.75 0 010 1.06l-3.75 3.75a.75.75 0 11-1.06-1.06l2.47-2.47H3a.75.75 0 010-1.5h16.19l-2.47-2.47a.75.75 0 010-1.06z" clip-rule="evenodd"></path>
                  </svg>
                </button>
                <em class="src self-center sm:self-end text-center sm:text-left">and join <span class="font-bold" x-text="cta.num_clicks"></span> community members!</em>
              </div>
            </div>
          </article>
          <article class="bulletin">
            <div class="vote">
              <button
                class="up"
                :class="{
                  'active': knownUserVotes[bulletin.id] === 1
                }"
                @click="registerVote(bulletin.id, 1)"
                aria-label="Upvote">&#9650;</button>
              <span class="score" x-text="bulletinsScores[bulletin.id]"></span>
              <button
                class="down"
                :class="{
                  'active': knownUserVotes[bulletin.id] === -1
                }"
                @click="registerVote(bulletin.id, -1)"
                aria-label="Downvote">&#9660;</button>
            </div>
            <div class="w-full min-w-0 flex flex-col">
              <h2 class="break-words" x-text="bulletin.title"></h2>
              <div class="flex flex-row items-start min-w-0">
                <p class="min-w-0 break-words" x-text="bulletin.excerpt"></p>
                <div class="ml-2">
                  <button
                    type="button"
                    title="Read more"
                    class="hover:cursor-pointer"
                    x-show="!shownBulletins[bulletin.id]"
                    @click="shownBulletins[bulletin.id] = true">
                    <!-- chevron-double-down -->
                    <svg
                      xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                      stroke-width="1.5" stroke="currentColor"
                      class="size-6">
                      <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 5.25 7.5 7.5 7.5-7.5m-15 6 7.5 7.5 7.5-7.5" />
                    </svg>
                  </button>
                  <button
                    type="button"
                    title="Hide bulletin"
                    class="hover:cursor-pointer"
                    x-show="shownBulletins[bulletin.id]"
                    @click="shownBulletins[bulletin.id] = false">
                    <!-- chevron-double-up -->
                    <svg
                      xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                      stroke-width="1.5" stroke="currentColor"
                      class="size-6">
                      <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 18.75 7.5-7.5 7.5 7.5" />
                      <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 7.5-7.5 7.5 7.5" />
                    </svg>
                  </button>
                </div>
              </div>
              <div x-html="getBulletinHTML(bulletin)"
                  class="text-sm py-2 text-justify"
                  :class="{
                    'hidden': !shownBulletins[bulletin.id]
                  }"></div>
              <div class="meta">
                <template x-for="tag in bulletin.tags.split(',')" :key="tag">
                  <span
                    class="chip" x-text="tag"></span>
                </template>
              </div>
              <div class="meta">
                <span class="src">sources: </span>
                <ul class="flex flex-row flex-wrap gap-2 min-w-0">
                  <template x-for="(src, i) in getSources(bulletin)" :key="src">
                    <li class="src">
                      <a :href="src" target="_blank" x-text="getSourceName(src)"></a>
                      <span x-show="i+1 < getSources(bulletin).length"> • </span>
                    </li>
                  </template>
                </ul>
              </div>
            </div>
          </article>
        </div>
      </template>
      <div class="w-full text-center">
        <button
          x-show="currentBulletinsPage+1 < totalBulletinsPages"
          type="button"
          class="mx-auto w-full max-w-[250px] p-2 flex flex-row gap-2 items-center justify-center bg-white rounded-md border border-gray-400 text-blue-400 hover:cursor-pointer hover:bg-gray-100 hover:text-blue-500"
          @click="loadMore()"
        >
          <!-- arrow-path -->
          <svg
            xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
            stroke-width="1.5" stroke="currentColor"
            class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
          </svg>
          <span>Load more</span>
        </button>
      </div>
    </div>

    <div x-show="showLicense" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" @click.self="showLicense = false">
      <div class="bg-white rounded-lg shadow-lg max-w-4xl w-full max-h-[90vh] overflow-y-auto">
        <div class="sticky top-0 bg-white border-b p-4 flex justify-between items-center">
          <h2 class="text-2xl font-bold">dHealth Insights License</h2>
          <button
            @click="showLicense = false"
            class="text-gray-500 hover:text-gray-700 text-2xl">✕</button>
        </div>
        <div class="p-6 prose prose-sm max-w-none" x-html="licenseMarkdown"></div>
      </div>
    </div>
  </main>

  <footer>
    <div class="mx-auto px-6 py-5">
      <div class="flex flex-col gap-3 sm:flex-row items-center sm:items-start sm:justify-between">
        <p class="text-xs text-slate-500">
          <span>Powered by </span><a href="https://dhealth.com" target="_blank" rel="noopener" class="text-blue-600 hover:text-blue-700"><b>dHealth Intelligence</b></a> • <em x-text="appVersion"></em> • <a class="hover:underline hover:opacity-80 transition-opacity" href="#" @click="openLicense()">LICENSE</a>
        </p>
        <p class="text-xs text-center font-medium text-slate-600">
          © <span x-text="copyYear"></span> <a href="https://evi.as" target="_blank" rel="noopener" class="text-blue-600 hover:text-blue-700">Grégory Saive</a><span> for </span><a href="https://resoftware.es" target="_blank" rel="noopener" class="text-blue-600 hover:text-blue-700">re:Software S.L.</a><span>, All rights reserved.</span>
        </p>
      </div>
    </div>
  </footer>

  <script>
    function insightsUI() {
      const log = window.createLogger("ui/main");
      return {
        // Config
        STORAGE_KEY: 'aidh_insights_prev_votes_v1',
        PROFILE_KEY: 'aidh_insights_uid',

        // Data
        appVersion: '@main/dev',
        copyYear: '2026',
        licenseMarkdown: '',
        latestBulletins: [],
        bulletinsScores: {},
        knownUserVotes: {},
        insightsUserID: '',
        sortedBy: 'hot',
        ctaEntries: [],

        // State
        loadingInfo: false,
        showLicense: false,
        currentBulletinsPage: 1,
        totalLatestBulletins: 0,
        totalBulletinsPages: 1,
        shownBulletins: {},
        loadingBulletins: false,

        // UI Helpers

        async init() {
          await this.loadSystemInfo();
          await this.loadCTAEntries();
          await this.loadLatestBulletins(1);

          this.insightsUserID = localStorage.getItem(this.PROFILE_KEY)||this.getRandomUserID();
          localStorage.setItem(this.PROFILE_KEY, this.insightsUserID);

          this.knownUserVotes = JSON.parse(localStorage.getItem(this.STORAGE_KEY)||'{}'); // {id: 1|-1}
        },

        paginate(p) {
          if (p < 1 || p > this.countBulletinsPages) {
            return false;
          }

          this.loadLatestBulletins(p);
        },

        getRandomUserID() {
          const array = new Uint8Array(4);
          crypto.getRandomValues(array);
          return array.toHex();
        },

        changeUserID() {
          this.resetVotes();
          this.insightsUserID = this.getRandomUserID();
          localStorage.setItem(this.PROFILE_KEY, this.insightsUserID);
        },

        getBulletinHTML(bulletin) {
          let html = bulletin.content.replace('\n', '<br />');
          html += `<br />
          <p class="text-right">
            Written by: ${bulletin.model}
          </p>`;
          return html;
        },

        getSources(bulletin) {
          let srcs = JSON.parse(bulletin.sources);
          return srcs;
        },

        getSourceName(sourceUrl) {
          return sourceUrl.replace(/https?\:\/\/(www\.)*/, '');
        },

        resetVotes() {
          this.knownUserVotes = {};
          localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.knownUserVotes));
        },

        async sortBy(by) {
          if (! ['hot', 'new', 'top'].includes(by)) by = 'hot';

          this.sortedBy = by;
          await this.loadLatestBulletins(this.currentBulletinsPage, by);
        },

        get sortedBulletins() {
          return this.latestBulletins;
        },

        async loadMore() {
          if (!this.sortedBy) this.sortedBy = 'hot';
          if (this.currentBulletinsPage+1 > this.totalBulletinsPages) {
            return ;
          }

          await this.loadLatestBulletins(this.currentBulletinsPage+1, this.sortedBy, true); // true=append
        },

        getRandomCTA() {
          const randCtaIdx = Math.floor(Math.random() * this.ctaEntries.length);
          return this.ctaEntries[randCtaIdx];
        },

        // API Helpers

        async loadSystemInfo() {
          // Fill "Today"
          document.getElementById('today').textContent=
            new Date().toLocaleDateString('en-US',{weekday:'short',year:'numeric',month:'short',day:'numeric'});

          const log = window.createLogger('core/system');
          this.loading = true;
          try {
            const res = await fetch(`/api/v1/system/info`);
            const data = await res.json();
            this.appVersion = data.appVersion;
          } catch (err) {
            log.error('Error loading system information', { err });
          } finally {
            this.loading = false;
          }
        },

        async openLicense() {
          const response = await fetch('/api/v1/system/license');
          const data = await response.json();

          const markdown = data.license

          if (typeof marked === 'undefined') {
            throw new Error('marked.js library not loaded');
          }

          // Parse markdown to HTML using marked
          this.licenseMarkdown = marked.parse(markdown);
          this.showLicense = true;
        },

        async loadLatestBulletins(p, s = 'hot', a = false) {
          this.loadingBulletins = true;
          try {
            let params = '';
            if (p) {
              params = params + '?page=' + p;
            }
            if (s) {
              params = params + '&sort=' + s;
            }
            const response = await fetch('/api/v1/bulletins/list' + params);
            if (response.ok) {
              const data = await response.json();
              if (a === true) {
                // APPEND mode ("load more")
                this.latestBulletins.push(...data.bulletins);
              } else {
                // SET mode ("view page x")
                this.latestBulletins = data.bulletins;
              }

              this.currentBulletinsPage = data.page;
              this.totalLatestBulletins = data.total;
              this.totalBulletinsPages = data.pages;
              this.sortedBy = data.sort;

              for (let j = 0; j < this.latestBulletins.length; j++) {
                const bid = this.latestBulletins[j].id;
                this.bulletinsScores[bid] = this.latestBulletins[j].upvotes - this.latestBulletins[j].downvotes;
              }
            }
          } catch (error) {
            log.error('Error loading bulletins', { error: error.message });
          }
          finally {
            this.loadingBulletins = false;
          }
        },

        async registerVote(bulletinID, value) {
          if (value !== 1 && value !== -1) {
            return ;
          }

          // skip already voted, allow only if vote changes.
          if (bulletinID in this.knownUserVotes && value === this.knownUserVotes[bulletinID]) {
            return ;
          }

          this.knownUserVotes[bulletinID] = value;
          localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.knownUserVotes));

          try {
            const response = await fetch('/api/v1/bulletins/vote', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                bulletinID: bulletinID,
                userID: this.insightsUserID,
                voteValue: value,
              }),
            });

            if (!response.ok) {
              const error = await response.json();
              throw new Error(error.error);
            }

            const data = await response.json();
            this.bulletinsScores[bulletinID] = data.score || 0;
          } catch (error) {
            log.error('Error registering vote', { error: error.message });
          }
        },

        async loadCTAEntries() {
          try {
            const response = await fetch('/api/v1/ads');
            if (response.ok) {
              const data = await response.json();
              this.ctaEntries = data.ads;
            }
          } catch (error) {
            log.error('Error reading ads', { error: error.message });
          }
        },

        async clickCTA(cta) {
          try {
            const response = await fetch('/api/v1/ads/click', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                ctaID: cta.id,
                userID: this.insightsUserID,
              }),
            });

            if (!response.ok) {
              const error = await response.json();
              throw new Error(error.error);
            }

            window.open(cta.cta_url, '_blank');
            return false;
          } catch (error) {
            log.error('Error registering click', { error: error.message });
          }
        }
      }
    }
  </script>

</body>
</html>
